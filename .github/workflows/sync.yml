name: Sync Surge Rules

on:
  workflow_dispatch:
    inputs:
      force:
        description: "规则条数比上次少一半以上时也照样覆盖"
        type: boolean
        default: false
  schedule:
    - cron: "30 3 * * *"
  push:
    branches: [main]
    paths:
      - sources.json
      - scripts/**
      - .github/workflows/sync.yml

permissions:
  contents: write

concurrency:
  group: sync-surge-rules
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Sync rules
        id: sync
        continue-on-error: true
        env:
          FORCE_FLAG: ${{ inputs.force && '--force' || '' }}
        run: python3 scripts/sync_surge_rules.py $FORCE_FLAG

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain -- rules README.md)" ]; then
            echo "No updates detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- rules README.md
          git commit -F .sync-commit-msg
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push

      - name: Fail if any source failed
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::error::Some sources failed to sync. Check the Sync rules step log."
          exit 1
